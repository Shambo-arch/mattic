<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F3EA" />
    <script>
      (() => {
        let mode = "system";
        try {
          mode = localStorage.getItem("store-theme") || mode;
        } catch {}
        document.documentElement.dataset.theme =
          mode === "dark" ||
          (mode !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      })();
    </script>
    <meta
      name="description"
      content="Suit and Tie Fashion Shop. Considered menswear for every occasion. Discover tailoring, everyday essentials and the finishing touches."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:site_name" content="Suit and Tie Fashion Shop" />
    <meta property="og:url" content="https://suitandtiefashionshop.com/" />
    <title>Suit and Tie Fashion Shop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
