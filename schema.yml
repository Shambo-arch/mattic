          - CONFIRMED
          - DELIVERED
          - PAYMENT_SUBMITTED
          - PENDING_PAYMENT
          - PROCESSING
          - SHIPPED
        description: |-
          * `PENDING_PAYMENT` - Pending Payment
          * `PAYMENT_SUBMITTED` - Payment Submitted
          * `CONFIRMED` - Confirmed
          * `PROCESSING` - Processing
