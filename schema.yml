openapi: 3.0.3
info:
  title: Suit and Tie Fashion Shop API
  version: 1.0.0
  description: Manual MTN MoMo verification. JSON responses use success/message/data
    envelopes.
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
